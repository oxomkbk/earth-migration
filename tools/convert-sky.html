window.convMilky = async () => {
  const t = await load('/sky/milkyway_2020_4k.exr'), { width: W, height: H, data } = t.image, C = data.length / (W * H);
  const lum = new Float32Array(W * H); for (let i = 0; i < W * H; i++) lum[i] = data[i * C] * 0.2126 + data[i * C + 1] * 0.7152 + data[i * C + 2] * 0.0722;

  for (let y = 0; y < H; y++) for (let i = 0; i < W; i++) {

window.convStars = async (maxN) => {
  const t = await load('/sky/hiptyc_2020_8k.exr'), { width: W, height: H, data } = t.image, C = data.length / (W * H);
  const L = i => data[i * C] + data[i * C + 1] + data[i * C + 2];
